# Learning-rate sweep for a 6-layer char-level GPT on Tiny Shakespeare (1 seed, 3000 steps).
# NOTE: ~50 epochs over a 1M-char corpus -> strong overfitting; kept as a generalization study.
# The optimizer comparison on language modeling uses configs/gpt_enwik8_lr_sweep.yaml.
script: experiments.train_gpt
out_dir: results/gpt_lr_sweep
seeds: [0]
common: {steps: 3000, batch_size: 64, block_size: 256, n_layer: 6, n_head: 6, n_embd: 384, warmup_steps: 100}
optimizers:
  sgd:      {lr: [0.1, 0.3, 1.0, 3.0],         wd: 0.0}
  momentum: {lr: [0.03, 0.1, 0.3, 1.0],        wd: 0.0}
  nag:      {lr: [0.03, 0.1, 0.3, 1.0],        wd: 0.0}
  adagrad:  {lr: [0.003, 0.01, 0.03, 0.1],     wd: 0.0}
  rmsprop:  {lr: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3], wd: 0.0}
  adam:     {lr: [3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2], wd: 0.0}
  adamw:    {lr: [3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2], wd: 0.1}
  signum:   {lr: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3], wd: 1.0}
  lion:     {lr: [3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3], wd: 1.0}
  shampoo:  {lr: [3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2], wd: 0.1}
  muon:     {lr: [0.01, 0.02, 0.05, 0.1],      wd: 0.1, aux_lr: 3.0e-3}
