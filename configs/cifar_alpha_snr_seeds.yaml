# Half-batch adaptive alpha: 3 seeds at the best lr of configs/cifar_alpha_snr.yaml.
script: experiments.train_cifar
out_dir: results/cifar_alpha_bs
seeds: [0, 1, 2]
common: {model: resnet18, epochs: 10, schedule: cosine, warmup_epochs: 1, wd: 0.05, aux_lr: 0.001}
optimizers:
  snr_bs64:   {optimizer: spectral, opt_kwargs: {alpha: snr}, lr: [0.01], batch_size: 64}
  snr_bs256:  {optimizer: spectral, opt_kwargs: {alpha: snr}, lr: [0.05], batch_size: 256}
  snr_bs1024: {optimizer: spectral, opt_kwargs: {alpha: snr}, lr: [0.1], batch_size: 1024}
