# Half-batch noise-adaptive spectral power (SpectralMuon alpha="snr"), learning-rate sweep with
# one seed at every batch size of configs/enwik8_alpha_bs.yaml (same 24.6M-token budget).
script: experiments.train_gpt
out_dir: results/enwik8_alpha_bs
seeds: [0]
common: {dataset: enwik8, block_size: 256, n_layer: 6, n_head: 6, n_embd: 384, eval_iters: 50, wd: 0.1, aux_lr: 0.003}
optimizers:
  snr_bs16:  {optimizer: spectral, opt_kwargs: {alpha: snr}, lr: [0.005, 0.01, 0.02], batch_size: 16, steps: 6000, warmup_steps: 300, eval_every: 600}
  snr_bs64:  {optimizer: spectral, opt_kwargs: {alpha: snr}, lr: [0.02, 0.04, 0.08], batch_size: 64, steps: 1500, warmup_steps: 75, eval_every: 150}
  snr_bs256: {optimizer: spectral, opt_kwargs: {alpha: snr}, lr: [0.04, 0.08, 0.16], batch_size: 256, steps: 375, warmup_steps: 19, eval_every: 38, grad_accum: 4}
