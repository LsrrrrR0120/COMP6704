# alpha = 0 vs alpha = -0.25 vs Muon with 3 seeds at every batch size, at the best lr of the
# single-seed sweeps (configs/*_alpha_bs.yaml, *_alpha_neg.yaml, *_alpha_lrext.yaml).
script: experiments.train_cifar
out_dir: results/cifar_alpha_bs
seeds:
- 0
- 1
- 2
common:
  model: resnet18
  epochs: 10
  schedule: cosine
  warmup_epochs: 1
  wd: 0.05
  aux_lr: 0.001
optimizers:
  a0_bs64:
    optimizer: spectral
    opt_kwargs:
      alpha: 0.0
    lr:
    - 0.01
    batch_size: 64
  a-0.25_bs64:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.25
    lr:
    - 0.02
    batch_size: 64
  muon_bs64:
    optimizer: muon
    lr:
    - 0.02
    batch_size: 64
  a0_bs256:
    optimizer: spectral
    opt_kwargs:
      alpha: 0.0
    lr:
    - 0.1
    batch_size: 256
  a-0.25_bs256:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.25
    lr:
    - 0.02
    batch_size: 256
  muon_bs256:
    optimizer: muon
    lr:
    - 0.05
    batch_size: 256
  a0_bs1024:
    optimizer: spectral
    opt_kwargs:
      alpha: 0.0
    lr:
    - 0.1
    - 0.2
    batch_size: 1024
  a-0.25_bs1024:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.25
    lr:
    - 0.1
    - 0.2
    batch_size: 1024
  muon_bs1024:
    optimizer: muon
    lr:
    - 0.05
    - 0.1
    batch_size: 1024
