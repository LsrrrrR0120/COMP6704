# Half-batch noise-adaptive spectral power (SpectralMuon alpha="snr"), learning-rate sweep with
# one seed at every batch size of configs/cifar_alpha_bs.yaml. The SNR -> alpha map is fixed
# in advance from the fixed-point diagnostic (experiments/noise_diagnostic.py).
script: experiments.train_cifar
out_dir: results/cifar_alpha_bs
seeds: [0]
common: {model: resnet18, epochs: 10, schedule: cosine, warmup_epochs: 1, wd: 0.05, aux_lr: 0.001}
optimizers:
  snr_bs64:   {optimizer: spectral, opt_kwargs: {alpha: snr}, lr: [0.01, 0.02, 0.04], batch_size: 64}
  snr_bs256:  {optimizer: spectral, opt_kwargs: {alpha: snr}, lr: [0.02, 0.05, 0.1], batch_size: 256}
  snr_bs1024: {optimizer: spectral, opt_kwargs: {alpha: snr}, lr: [0.05, 0.1, 0.2], batch_size: 1024}
