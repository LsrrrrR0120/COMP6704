# alpha = 0 vs alpha = -0.25 vs Muon with 3 seeds at every batch size, at the best lr of the
# single-seed sweeps (configs/*_alpha_bs.yaml, *_alpha_neg.yaml, *_alpha_lrext.yaml).
script: experiments.train_gpt
out_dir: results/enwik8_alpha_bs
seeds:
- 0
- 1
- 2
common:
  dataset: enwik8
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  eval_iters: 50
  wd: 0.1
  aux_lr: 0.003
optimizers:
  a0_bs16:
    optimizer: spectral
    opt_kwargs:
      alpha: 0.0
    lr:
    - 0.01
    batch_size: 16
    steps: 6000
    warmup_steps: 300
    eval_every: 600
  a-0.25_bs16:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.25
    lr:
    - 0.01
    batch_size: 16
    steps: 6000
    warmup_steps: 300
    eval_every: 600
  muon_bs16:
    optimizer: muon
    lr:
    - 0.01
    batch_size: 16
    steps: 6000
    warmup_steps: 300
    eval_every: 600
  a0_bs64:
    optimizer: spectral
    opt_kwargs:
      alpha: 0.0
    lr:
    - 0.02
    batch_size: 64
    steps: 1500
    warmup_steps: 75
    eval_every: 150
  a-0.25_bs64:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.25
    lr:
    - 0.04
    batch_size: 64
    steps: 1500
    warmup_steps: 75
    eval_every: 150
  muon_bs64:
    optimizer: muon
    lr:
    - 0.04
    batch_size: 64
    steps: 1500
    warmup_steps: 75
    eval_every: 150
  a0_bs256:
    optimizer: spectral
    opt_kwargs:
      alpha: 0.0
    lr:
    - 0.04
    - 0.08
    batch_size: 256
    steps: 375
    warmup_steps: 19
    eval_every: 38
    grad_accum: 4
  a-0.25_bs256:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.25
    lr:
    - 0.04
    - 0.08
    batch_size: 256
    steps: 375
    warmup_steps: 19
    eval_every: 38
    grad_accum: 4
  muon_bs256:
    optimizer: muon
    lr:
    - 0.04
    - 0.08
    batch_size: 256
    steps: 375
    warmup_steps: 19
    eval_every: 38
    grad_accum: 4
