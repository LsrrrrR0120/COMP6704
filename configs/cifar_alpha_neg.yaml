# Negative spectral powers (alpha < 0 amplifies small singular directions beyond the polar
# factor), to check whether the best alpha of configs/cifar_alpha_bs.yaml lies at alpha = 0
# or below it. Same out_dir, so plots.plot_alpha_bs shows both sweeps together.
script: experiments.train_cifar
out_dir: results/cifar_alpha_bs
seeds:
- 0
common:
  model: resnet18
  epochs: 10
  schedule: cosine
  warmup_epochs: 1
  wd: 0.05
  aux_lr: 0.001
optimizers:
  a-0.25_bs64:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.25
    lr:
    - 0.02
    - 0.05
    - 0.1
    batch_size: 64
  a-0.25_bs256:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.25
    lr:
    - 0.02
    - 0.05
    - 0.1
    batch_size: 256
  a-0.25_bs1024:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.25
    lr:
    - 0.02
    - 0.05
    - 0.1
    batch_size: 1024
  a-0.5_bs1024:
    optimizer: spectral
    opt_kwargs:
      alpha: -0.5
    lr:
    - 0.02
    - 0.05
    - 0.1
    batch_size: 1024
